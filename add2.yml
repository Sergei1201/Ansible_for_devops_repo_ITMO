- hosts: all
  become: true
  tasks:
    - name: Create a new user and generate a private SSH key for him/her (on a remote Linux machine of course)
      ansible.builtin.user:
        name: sokolov
        groups: sudo
        append: true
        create_home: true
        generate_ssh_key: yes
        ssh_key_type: ed25519
        ssh_key_file: .ssh/id_ed25519

